<script>
const botao = document.getElementById("btnConteudo");

const CHAVE_BLOQUEIO = "purchase_lock_until";
const TEMPO_BLOQUEIO = 48 * 60 * 60 * 1000; // 48 horas

function verificarBloqueio() {
  const bloqueadoAte = localStorage.getItem(CHAVE_BLOQUEIO);

  if (bloqueadoAte && Date.now() < Number(bloqueadoAte)) {
    botao.disabled = true;
    botao.innerText = "ACESSO JÁ LIBERADO";
    return true;
  }

  return false;
}

// Verifica ao carregar a página
verificarBloqueio();

botao.addEventListener("click", function() {

  if (verificarBloqueio()) return;

  // Dispara Purchase de R$14,00
  fbq('trackSingle', '1460995941881705', 'Purchase', {
    value: 14.00,
    currency: 'BRL'
  });

  // Bloqueia por 48 horas
  const bloqueadoAte = Date.now() + TEMPO_BLOQUEIO;
  localStorage.setItem(CHAVE_BLOQUEIO, bloqueadoAte);

  botao.disabled = true;
  botao.innerText = "ACESSO JÁ LIBERADO";
});
</script>
